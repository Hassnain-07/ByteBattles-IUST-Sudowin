<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - ByteBattles</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <main>
    <div class="card narrow">
      <h1>Create an account</h1>
      <div id="message"></div>

      <form id="register-form">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" required pattern="[A-Za-z0-9_]{3,20}">
        <div class="hint">3-20 characters: letters, numbers and underscores.</div>

        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="new-password" required minlength="8">
        <div class="hint">At least 8 characters, with at least one letter and one number.</div>

        <label for="conf_password">Confirm password</label>
        <input type="password" id="conf_password" autocomplete="new-password" required>

        <div class="form-actions">
          <button type="submit" id="submit">Register</button>
          <span class="muted small">Have an account? <a href="login.html">Log in</a></span>
        </div>
      </form>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/pages/register.js"></script>
</body>
</html>
