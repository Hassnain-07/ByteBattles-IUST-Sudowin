# Serves the static frontend and forwards /api/* to the FastAPI service,
# so the browser only ever talks to one origin (no CORS needed).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # testcase zips are uploaded through here
    client_max_body_size 50m;

    location /api/ {
        # the trailing slash strips the /api prefix: /api/problems/ -> /problems/
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
